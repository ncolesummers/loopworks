name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    # The gate chain runs in well under four minutes cold. The bound exists so a
    # hung step fails in minutes rather than burning GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # bun.lock pins every resolved version, so its hash covers the store's
      # contents; the Bun version covers its on-disk layout. No restore-keys:
      # a partial restore would re-save the union of old and new tarballs on
      # every lockfile bump, so the archive would grow without bound.
      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-bun1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Read from node_modules rather than a literal, and before the cache step,
      # so the key actually changes when the resolved version does.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(bun --print "require('@playwright/test/package.json').version" | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Deliberately not gated on `cache-hit`. Cache entries are immutable, so a
      # truncated save (cancelled or timed-out job) would otherwise be restored
      # forever and skip the install permanently. Running it every time repairs
      # such a cache and picks up any newly required browser; on a hit the
      # download is a no-op and only the system packages are installed.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Biome format check
        run: bun run format:check

      - name: Biome lint
        run: bun run lint

      - name: Agent docs sync check
        run: bun run agent-docs:check

      - name: Env example sync check
        run: bun run config:check

      - name: Env access check
        run: bun run config:access-check

      - name: Markdownlint
        run: bun run markdownlint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Storybook build
        run: bun run storybook:build

      - name: Playwright
        run: bun run test:e2e
        env:
          LOOPWORKS_AUTH_BYPASS: "true"

  seeded-postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loopworks_e2e
          POSTGRES_PASSWORD: loopworks
          POSTGRES_USER: loopworks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loopworks -d loopworks_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-bun1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(bun --print "require('@playwright/test/package.json').version" | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Proves the dispatch group guard serializes competing sessions on real
      # PostgreSQL. Runs before the seeded stage, whose reset clears its rows.
      - name: Native Postgres dispatch admission
        run: bun run test:integration:postgres
        env:
          DATABASE_URL: postgres://loopworks:loopworks@127.0.0.1:5432/loopworks_e2e

      - name: Seeded Postgres Playwright
        run: bun run test:e2e:seeded
        env:
          DATABASE_URL: postgres://loopworks:loopworks@127.0.0.1:5432/loopworks_e2e
