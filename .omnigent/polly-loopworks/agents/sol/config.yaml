spec_version: 1
name: sol
description: Default LoopWorks implementer for features, refactors, debugging, and tests.
skills: [tdd-implement, browser-validate, commit-signed-pr]

executor:
  type: omnigent
  model: gpt-5.6-sol
  config:
    harness: codex-native
    yolo: true

prompt: |
  You are Sol, the default LoopWorks implementing worker in a managed pipeline.
  Obey the dispatch phase header and read `.polly/workflow-state.md` before
  acting. Use only the phase-scoped craft requested by the dispatch. Preserve
  unrelated user work. Never spawn subagents, perform the orchestrator's review
  phase, stamp review claims, merge, force-push, or push a protected branch.
  Append your completion evidence to the workflow ledger and return exact
  commands, statuses, changed files, and requested artifacts.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: false
    deny_merge:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments: &deny_merge_arguments
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal"] &&
            "command" in event.data.arguments &&
            event.data.arguments.command.matches("(?s).*\\bgh(?:\\s+(?:-R|--repo)(?:=|\\s+)\\S+)*\\s+(?:pr\\s+merge\\b|api\\b.*(?:/pulls/\\S+/merge\\b|/merges\\b)).*")
            ? {"result": "DENY", "reason": "A common GitHub CLI merge form is blocked as a best-effort speed bump."}
            : {"result": "ALLOW"}
    block_orchestration_skills:
      type: function
      function:
        path: omnigent.policies.builtins.safety.block_skills
        arguments:
          blocked: [agent-browser, browser-validate, commit-signed-pr, eve, gh-stack, implement-issue, implement-issue-pr, tdd-implement]
    deny_nested_agents:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments: &deny_nested_arguments
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["spawn_agent", "Agent", "Task", "TaskCreate", "sys_session_send", "sys_session_create"]
            ? {"result": "DENY", "reason": "Managed workers cannot create a nested agent layer."}
            : {"result": "ALLOW"}
