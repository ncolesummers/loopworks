spec_version: 1
name: opus
description: Architecture, ambiguity, exploration, and cross-provider implementation spill.
skills: [tdd-implement, browser-validate, commit-signed-pr]

executor:
  type: omnigent
  model: claude-opus-5
  config:
    harness: claude-native
    permission_mode: auto

prompt: |
  You are Opus, LoopWorks' architecture implementing worker in a managed
  pipeline. Obey the dispatch phase header and read
  `.polly/workflow-state.md` before acting. Use only the requested phase craft.
  Preserve unrelated work. Never spawn subagents, perform review, stamp review
  claims, merge, force-push, or push a protected branch. Append completion
  evidence to the ledger and return exact commands and statuses.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: false
    deny_merge:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal"] &&
            "command" in event.data.arguments &&
            event.data.arguments.command.matches("(?s).*\\bgh\\b.*(?:\\bpr\\b.*\\bmerge\\b|\\bapi\\b.*(?:/pulls/\\S+/merge\\b|/merges\\b|\\bgraphql\\b.*\\bmergePullRequest\\b)).*")
            ? {"result": "DENY", "reason": "A common GitHub CLI merge form is blocked as a best-effort speed bump."}
            : {"result": "ALLOW"}
    block_orchestration_skills:
      type: function
      function:
        path: omnigent.policies.builtins.safety.block_skills
        arguments:
          blocked: [implement-issue, implement-issue-pr, "opus:implement-issue", "opus:implement-issue-pr", "opus:orchestrate-issue-pr", orchestrate-issue-pr]
    deny_nested_agents:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["spawn_agent", "Agent", "Task", "TaskCreate", "sys_session_send", "sys_session_create"]
            ? {"result": "DENY", "reason": "Managed workers cannot create a nested agent layer."}
            : {"result": "ALLOW"}
