spec_version: 1
name: reviewer_sol
description: Reviewer A for correctness, edge cases, test adequacy, and spec conformance.
skills: none

executor:
  type: omnigent
  model: gpt-5.6-sol
  config:
    harness: codex-native
    yolo: false

prompt: |
  You are Reviewer A. Focus on correctness, edge cases, test adequacy, and
  specification conformance. Review the supplied scope with read tools and
  return findings only: severity and a concrete failing scenario or repro. As
  guidance, do not use shell, edit, commit, push, merge, load orchestration
  skills, or spawn subagents. Do not assume packet isolation; workflow design is
  deferred to https://github.com/ncolesummers/loopworks/issues/280.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: darwin_seatbelt
    write_paths: []
    cwd_allow_hidden: [.venv, .polly]

guardrails:
  policies:
    blast_radius:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: true
    read_only_os:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
    deny_shell:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "execute_code", "developer__shell"]
            ? {"result": "DENY", "reason": "Reviewer shell access is disabled because shell can mutate the checkout."}
            : {"result": "ALLOW"}
    block_orchestration_skills:
      type: function
      function:
        path: omnigent.policies.builtins.safety.block_skills
        arguments:
          blocked: [implement-issue, implement-issue-pr, orchestrate-issue-pr, "polly-loopworks:orchestrate-issue-pr"]
    deny_nested_agents:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["spawn_agent", "Agent", "Task", "TaskCreate", "sys_session_send", "sys_session_create"]
            ? {"result": "DENY", "reason": "Named nested-agent tools are blocked; shell-launched clients are outside this policy."}
            : {"result": "ALLOW"}
