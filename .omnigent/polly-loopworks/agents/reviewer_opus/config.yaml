spec_version: 1
name: reviewer_opus
description: Reviewer B for architecture, blast radius, coupling, and adjacent systems.
skills: none

executor:
  type: omnigent
  model: claude-opus-5
  config:
    harness: claude-native
    permission_mode: plan

prompt: |
  You are Reviewer B in a managed pipeline. Focus on architecture, blast radius,
  coupling, and adjacent systems. Read the supplied review packet with read tools
  only. Return findings only: severity and a concrete failing scenario or repro.
  No fixes and no praise. Never use shell, edit files, create commits, push,
  merge, load orchestration skills, or spawn subagents.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: darwin_seatbelt
    write_paths: []
    cwd_allow_hidden: [.venv, .polly]

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: true
    read_only_os:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
    deny_shell:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "execute_code", "developer__shell"]
            ? {"result": "DENY", "reason": "Reviewer shell access is disabled because shell can mutate the checkout."}
            : {"result": "ALLOW"}
    block_orchestration_skills:
      type: function
      on: [request, tool_call]
      function:
        path: omnigent.policies.builtins.safety.block_skills
        arguments:
          blocked: [implement-issue, implement-issue-pr]
    deny_nested_agents:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["spawn_agent", "Agent", "Task", "TaskCreate", "sys_session_send", "sys_session_create"]
            ? {"result": "DENY", "reason": "Managed workers cannot create a nested agent layer."}
            : {"result": "ALLOW"}
