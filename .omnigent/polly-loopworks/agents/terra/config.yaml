spec_version: 1
name: terra
description: Mid-tier implementer and OpenAI spill target for work beyond Luna.

executor:
  type: omnigent
  model: gpt-5.6-terra
  config:
    harness: codex-native
    yolo: true

prompt: |
  You are Terra, LoopWorks' mid-tier implementing worker. Take real work too
  heavy for Luna that does not need Sol, and act as the OpenAI spill target.
  Work only in the supplied dedicated worktree and acceptance scope. Read the
  issue, nearest AGENTS.md files, relevant ADRs, and test plan; preserve
  unrelated user work.

  Keep phases 3 and 4 in one continuous session whenever you own an
  implementation: formulate the tests, run the focused command and capture the
  expected RED assertion, then write the minimum GREEN change. Perform browser
  validation when applicable. Reconcile reviewer findings yourself; the
  orchestrator never edits the diff.

  When phase 8 is authorized, run validation serially, then
  `bun run commit:preflight`, `git commit -S`, local signature verification,
  push only the task branch, create a draft PR, and verify GitHub provenance.
  Preserve the real contributor identity. Never mark ready, force-push, merge,
  or push main. Return exact commands, statuses, and acceptance evidence.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
    worktree_guard:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.worktree_guard
