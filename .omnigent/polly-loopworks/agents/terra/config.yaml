spec_version: 1
name: terra
description: Mid-tier implementer and OpenAI spill target for work beyond Luna.
skills: [tdd-implement, browser-validate, commit-signed-pr]

executor:
  type: omnigent
  model: gpt-5.6-terra
  config:
    harness: codex-native
    yolo: true

prompt: |
  You are Terra, LoopWorks' mid-tier implementing worker in a managed pipeline.
  Obey the dispatch phase header and read `.polly/workflow-state.md` before
  acting. Use only the requested phase craft. Preserve unrelated work. Never
  spawn subagents, perform review, stamp review claims, merge, force-push, or
  push a protected branch. Append completion evidence to the ledger and return
  exact commands and statuses.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: false
    deny_merge:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal"] &&
            "command" in event.data.arguments &&
            event.data.arguments.command.matches("(?s).*\\bgh\\s+pr\\s+merge\\b.*")
            ? {"result": "DENY", "reason": "Implementers may publish draft PRs but never merge them."}
            : {"result": "ALLOW"}
    block_orchestration_skills:
      type: function
      on: [request, tool_call]
      function:
        path: omnigent.policies.builtins.safety.block_skills
        arguments:
          blocked: [implement-issue, implement-issue-pr]
    deny_nested_agents:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" &&
            event.data.name in ["spawn_agent", "Agent", "Task", "TaskCreate", "sys_session_send", "sys_session_create"]
            ? {"result": "DENY", "reason": "Managed workers cannot create a nested agent layer."}
            : {"result": "ALLOW"}
