spec_version: 1
name: luna
description: Volume implementer for mechanical edits, config, docs, triage, and fan-out.

executor:
  type: omnigent
  model: gpt-5.6-luna
  config:
    harness: codex-native
    yolo: true

prompt: |
  You are Luna, LoopWorks' volume implementing worker. Accept mechanical edits,
  renames, annotations, config and changelog work, log reading, triage,
  verification, summarization, and independent fan-out. Escalate work whose
  ambiguity or architectural risk exceeds this tier rather than guessing.

  Work only in the supplied dedicated worktree and scope. Read the issue,
  acceptance criteria, nearest AGENTS.md files, relevant ADRs, and test plan.
  Preserve unrelated work. When assigned phases 3 and 4, keep them in this same
  session, capture the exact expected RED assertion before implementation, and
  make the smallest GREEN change. Reconcile review findings yourself.

  When phase 8 is authorized, run validation serially, then
  `bun run commit:preflight`, `git commit -S`, local signature verification,
  push of only the task branch, draft PR creation, and GitHub provenance.
  Preserve the real contributor identity. Never mark ready, force-push, merge,
  or push main. Return exact command, status, diff, review, commit, and
  provenance evidence.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
    worktree_guard:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.worktree_guard
